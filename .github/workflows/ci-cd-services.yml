name: Production Services Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'messages/**'
      - 'project.inlang/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'drizzle.config.ts'
      - 'Dockerfile'
      - 'Dockerfile.migrator'
      - '.dockerignore'
      - '.github/workflows/ci-cd-services.yml'
      - '.github/workflows/ci-cd-migrator.yml'
      - '.github/workflows/_build-deploy.yml'
      - '.github/workflows/_quality.yml'

concurrency:
  group: services-production
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
      migrator: ${{ steps.detect.outputs.migrator }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected services
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            {
              echo "app=true"
              echo "migrator=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shared=(package.json bun.lock tsconfig.json .dockerignore .github/workflows/ci-cd-services.yml .github/workflows/_build-deploy.yml .github/workflows/_quality.yml)

          {
            if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- \
              "src" \
              "messages" \
              "project.inlang" \
              "public" \
              "vite.config.ts" \
              "Dockerfile" \
              "${shared[@]}"; then
              echo "app=false"
            else
              echo "app=true"
            fi

            if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- \
              "drizzle" \
              "src/db" \
              "drizzle.config.ts" \
              "Dockerfile.migrator" \
              ".github/workflows/ci-cd-migrator.yml" \
              "${shared[@]}"; then
              echo "migrator=false"
            else
              echo "migrator=true"
            fi
          } >> "$GITHUB_OUTPUT"

  migrator:
    needs: [quality, changes]
    if: needs.changes.outputs.migrator == 'true'
    uses: ./.github/workflows/ci-cd-migrator.yml
    secrets: inherit

  app:
    needs: [quality, changes, migrator]
    if: always() && needs.quality.result == 'success' && (needs.migrator.result == 'success' || needs.migrator.result == 'skipped') && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      app_name: app
      dockerfile: Dockerfile
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_APP_WEBHOOK }}
