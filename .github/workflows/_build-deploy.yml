name: Reusable Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      build_args:
        required: false
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      DOKPLOY_WEBHOOK:
        required: true

jobs:
  build:
    name: Build ${{ inputs.app_name }} image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: docker-hub.afron.group
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: ${{ inputs.build_args }}
          tags: |
            docker-hub.afron.group/store-${{ inputs.app_name }}:${{ github.sha }}
            docker-hub.afron.group/store-${{ inputs.app_name }}:latest
          cache-from: type=gha,scope=${{ inputs.app_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app_name }}

  deploy:
    name: Deploy ${{ inputs.app_name }} via Dokploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger Dokploy deploy webhook
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: curl --fail-with-body --request POST "$DOKPLOY_WEBHOOK"
