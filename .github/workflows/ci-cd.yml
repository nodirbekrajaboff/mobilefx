name: Production CI/CD (Dokploy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'messages/**'
      - 'project.inlang/**'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'

concurrency:
  group: production-deployment
  cancel-in-progress: false # Never interrupt active production deployments or migrations

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/_quality.yml

  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
      migrator: ${{ steps.detect.outputs.migrator }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected components
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "migrator=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shared=(package.json bun.lock tsconfig.json .dockerignore .github/workflows)

          if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- src public messages project.inlang vite.config.ts Dockerfile "${shared[@]}"; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- src/db drizzle.config.ts drizzle "${shared[@]}"; then
            echo "migrator=false" >> "$GITHUB_OUTPUT"
          else
            echo "migrator=true" >> "$GITHUB_OUTPUT"
          fi

  migrator:
    name: Run Database Migrations
    needs: [quality, changes]
    if: needs.changes.outputs.migrator == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: quality-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            quality-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Execute Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "ℹ️ DATABASE_URL secret is not set; skipping automatic migration step."
            exit 0
          fi
          if [[ -d "drizzle" ]]; then
            bun run db:migrate
          else
            echo "ℹ️ No ./drizzle migration folder found yet; skipping db:migrate."
          fi

  deploy:
    name: Build & Deploy App (TanStack + Elysia + grammY)
    needs: [quality, changes, migrator]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (needs.migrator.result == 'success' || needs.migrator.result == 'skipped') &&
      needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      app_name: app
      dockerfile: Dockerfile
      registry_url: docker-hub.afron.group
      image_prefix: store
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
