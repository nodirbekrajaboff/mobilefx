services:
  seed:
    image: docker-hub.afron.group/store-seed:latest
    pull_policy: always
    restart: 'no'
    networks:
      - dokploy-network
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-seed-secret-key-at-least-32-chars}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin@mobilefix.uz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password123}

networks:
  dokploy-network:
    external: true
